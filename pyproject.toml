[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum"
version = "0.1.0"
description = "Simple GUI for BOTB scraping and YOLO person detection."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

